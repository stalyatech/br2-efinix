# ti375_oob — hand-authored U-Boot config overrides.
#
# Applied after boards/efinix/common/u-boot/uboot_base_defconfig and
# uboot_<arch>_defconfig, so everything here wins.
#
# Values that are derived from soc.h (UART base, UART clock) are NOT here —
# `efx config configure` generates those into state/uboot_derived.cfg so they can
# never drift from the hardware description.

# The stock boards/efinix/<board>/u-boot/uboot_defconfig is never applied by
# init.sh (its path test at init.sh:567 compares against a literal
# "$(BR2_EXTERNAL_EFINIX_PATH)/..." string, which is never a real file), so the
# ISA selection is repeated here where it actually takes effect.
CONFIG_RISCV_ISA_A=y
CONFIG_RISCV_ISA_C=y
CONFIG_RISCV_ISA_F=y
CONFIG_RISCV_ISA_D=y

# U-Boot's host-side tools build unconditionally, and mkeficapsule pulls in
# GnuTLS headers. This board has no EFI anything — the FSBL copies OpenSBI and
# U-Boot straight out of SPI flash — so the tool is never used, and building it
# would make libgnutls28-dev a prerequisite for no benefit.
# CONFIG_TOOLS_MKEFICAPSULE is not set

# Boot flash layout (SPI0, IS25WP512M). The FSBL reads OpenSBI and U-Boot at
# the offsets in tools/efx/fsbl/bootloaderConfig.h; `efx flash` writes every
# image at these offsets and refuses a bitstream that would run into OpenSBI.
#   0x000000  6M    fpga_bitstream
#   0x600000  512K  opensbi
#   0x680000  768K  uboot
#   0x740000  64K   dtb
#   0x750000  64K   bootscr
#   0x760000  640K  reserved
#   0x800000  rest  kernel (Image with the initramfs)
CONFIG_MTDPARTS_DEFAULT="mtdparts=nor0:6m(fpga_bitstream),512k(opensbi),768k(uboot),64k(dtb),64k(bootscr),640k(reserved),-(kernel)"

# Boot from the SPI flash: run the script `efx flash` writes at 0x750000. It is
# generated with the exact image sizes, so nothing here has to know them.
CONFIG_BOOTCOMMAND="sf probe 0 && sf read 0x08f00000 0x750000 0x10000 && source 0x08f00000"
CONFIG_BOOTDELAY=3
